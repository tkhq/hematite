# Perf upstream: TLS, keep-alive, static 1KB body, and a header-echo
# endpoint for conformance assertions. http2 stays off so both proxies see
# identical upstream protocol behavior.
events {}
http {
  access_log off;
  server {
    listen 443 ssl;
    server_name upstream.test denied.test;
    ssl_certificate /certs/echo.fullchain.crt;
    ssl_certificate_key /certs/echo.key;
    root /www;
    location = /1k.json { default_type application/json; }
    location = /echo {
      default_type application/json;
      return 200 '{"authorization":"$http_authorization","x_evil_header":"$http_x_evil_header"}';
    }
  }
}
