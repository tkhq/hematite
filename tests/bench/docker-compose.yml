# Benchmark fixture: two TLS upstreams, both proxies (Tasks 2-3), and a
# loadgen. Traffic flows over each proxy's CONNECT tunnel listener, so no
# DNS interception is involved; hostnames resolve via network aliases.
services:
  upstream:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
      - ./www:/www:ro
    networks:
      bench:
        ipv4_address: 172.28.0.10
        aliases: [upstream.test, denied.test]

  stream:
    image: python:3.12-slim
    command: ["python3", "/echo.py"]
    volumes:
      - ./echo.py:/echo.py:ro
      - ./certs:/certs:ro
    networks:
      bench:
        ipv4_address: 172.28.0.11
        aliases: [stream.test]

  hematite:
    build:
      context: ../..
    environment:
      BENCH_API_KEY: sk-bench-real-key-do-not-log
      HEMATITE_MANAGEMENT_API_KEY: bench-mgmt-token
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - ./configs/${HEMATITE_CONFIG:-hematite.yaml}:/etc/hematite/hematite.yaml:ro
      - ./certs:/certs:ro
    extra_hosts:
      - "imds-test.local:169.254.169.254"
    networks:
      bench:
        ipv4_address: 172.28.0.2

  iron:
    # Brief specified ironsh/iron-proxy:v0.49.0; Docker Hub uses no "v" prefix — actual tag is 0.49.0.
    # Entrypoint is the iron-proxy binary directly (not a wrapper script).
    # Secrets block uses nested replace: form required by v0.49.0 schema (see configs/iron.yaml).
    image: ironsh/iron-proxy:0.49.0
    command: ["-config", "/etc/iron-proxy/proxy.yaml"]
    environment:
      BENCH_API_KEY: sk-bench-real-key-do-not-log
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - ./configs/iron.yaml:/etc/iron-proxy/proxy.yaml:ro
      - ./certs:/certs:ro
    extra_hosts:
      - "imds-test.local:169.254.169.254"
    networks:
      bench:
        ipv4_address: 172.28.0.3

  loadgen:
    build:
      context: .
      dockerfile: loadgen.Dockerfile
    volumes:
      - ./certs:/certs:ro
      - ./scripts:/scripts:ro
      - ./results:/results
    networks:
      bench:
        ipv4_address: 172.28.0.20

networks:
  bench:
    ipam:
      config:
        - subnet: 172.28.0.0/24
