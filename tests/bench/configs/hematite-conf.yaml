# Conformance config: perf-equivalent transforms plus header_allowlist.
dns:
  enabled: true
  listen: ":53"
  proxy_ip: "172.28.0.2"

proxy:
  http_listen: ":80"
  https_listen: ":443"
  tunnel_listen: ":8080"

tls:
  ca_cert: "/certs/ca.crt"
  ca_key: "/certs/ca.key"

transforms:
  - name: allowlist
    config:
      domains:
        - "upstream.test"
        - "stream.test"
        - "llm.test"
        - "imds-test.local"

  - name: secrets
    config:
      secrets:
        - source: { type: env, var: BENCH_API_KEY }
          proxy_value: "proxy-bench-token-123"
          match_headers: ["Authorization"]
          rules:
            - host: "upstream.test"
            - host: "llm.test"

  - name: header_allowlist
    config:
      headers:
        - "Authorization"
        - "Accept"
        - "Host"
        - "User-Agent"
        - "Content-Type"
      rules:
        - host: "upstream.test"

management:
  listen: "0.0.0.0:9092"
  api_key_env: "HEMATITE_MANAGEMENT_API_KEY"

log:
  level: "info"
