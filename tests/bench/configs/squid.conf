# Squid ssl-bump egress proxy — spirit-equivalent config: default-deny
# CONNECT allowlist, TLS MITM with the shared bench CA. Squid has no
# secret-injection, header-allowlist, or resolved-IP deny features; those
# conformance rows are N/A for it.
http_port 8080 ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=16MB tls-cert=/certs/ca.crt tls-key=/certs/ca.key
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 16MB
sslcrtd_children 5

acl allowed_connect dstdomain upstream.test stream.test llm.test imds-test.local
acl allowed_sni ssl::server_name upstream.test stream.test llm.test imds-test.local
acl step1 at_step SslBump1

ssl_bump peek step1
ssl_bump bump allowed_sni
ssl_bump terminate all

# Allow both the CONNECT and the bumped inner requests to allowed hosts.
http_access allow allowed_connect
http_access deny all

# Trust the bench CA for the upstream leg (the upstreams' leaves chain to it).
tls_outgoing_options cafile=/certs/ca.crt

cache deny all
access_log none
pid_filename none
