[workspace]
resolver = "2"
members = ["crates/hematite-kernel", "crates/hematite-proxy", "crates/hematite-dns", "crates/hematite"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tkhq/test-hematite"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
bytes = "1"
# ring backend, not aws-lc-rs: no C toolchain needed, keeps the build portable.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
lru = "0.16"
hematite-kernel = { path = "crates/hematite-kernel" }
hematite-proxy = { path = "crates/hematite-proxy" }
hematite-dns = { path = "crates/hematite-dns" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "registry"] }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio", "experimental_async_runtime", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "hyper-client"] }
opentelemetry-http = { version = "0.32.0", features = ["hyper"] }
tracing-opentelemetry = "0.33.0"
