[workspace]
resolver = "2"
members = ["crates/hematite-kernel"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tkhq/test-hematite"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zeroize = "1"
